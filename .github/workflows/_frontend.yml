name: Deploy PWA to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'frontend/**'
      - '.github/workflows/_frontend.yml'
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@8.8.0 --activate

      - name: Verify pnpm
        run: pnpm -v

      - name: Fallback install pnpm
        if: failure()
        run: npm install -g pnpm@8.8.0

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend run build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Fix permissions
        run: |
          chmod -c -R +rX "frontend/dist/" | while read line; do
            echo "::debug::$line"
          done

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy_site:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
