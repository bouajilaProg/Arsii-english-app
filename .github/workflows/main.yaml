name: Main Deployment Pipeline

on:
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # call-backend:
    # uses: ./.github/workflows/_backend.yml

  call-frontend:
    # needs: call-backend
    uses: ./.github/workflows/_frontend.yml
    secrets: inherit

  deploy_site:
    needs: call-frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
